openapi: 3.1.0
info:
  title: Shelfline Distributors API
  version: 0.1.0
  description: |
    Distributor registry, experience-ownership contracts, activate/amend, and pause/resume.
  license:
    name: Proprietary
    url: https://shelfline.local/license
  x-domain: dst
servers:
  - url: https://api.shelfline.local
    description: Local / Shelfline API
security:
  - apiKey: []
  - bearerAuth: []

tags:
  - name: Distributors
    description: Distributor registry and contracts
paths:
  /v1/distributors:
    get:
      operationId: listDistributors
      tags: [Distributors]
      summary: List distributors
      security:
        - bearerAuth: []
      x-zero-ui:
        label: { en: Distributor registry }
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            $ref: ./distributors.schemas.yaml#/components/schemas/DistributorStatus
      responses:
        '200':
          description: Distributors page
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributorListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: registerDistributor
      tags: [Distributors]
      summary: Register distributor
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      x-repository: DISTRIBUTOR
      x-dynamodb:
        entityType: "DISTRIBUTOR"
        pkPatternTemplate: "DST#${distributorId}"
        skPatternTemplate: "METADATA"
        pkPattern: template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./distributors.schemas.yaml#/components/schemas/DistributorCreate
      responses:
        '201':
          description: Distributor registered
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributorResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/distributors/{distributorId}:
    parameters:
      - name: distributorId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDistributor
      tags: [Distributors]
      summary: Get distributor
      security:
        - bearerAuth: []
      x-repository: DISTRIBUTOR
      x-dynamodb:
        entityType: "DISTRIBUTOR"
        pkPatternTemplate: "DST#${distributorId}"
        skPatternTemplate: "METADATA"
        pkPattern: template
      responses:
        '200':
          description: Distributor
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributorResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/distributors/{distributorId}/contracts:
    parameters:
      - name: distributorId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listDistributionContracts
      tags: [Distributors]
      summary: List contracts for distributor
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Contracts
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributionContractListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createDistributionContract
      tags: [Distributors]
      summary: Create distribution contract
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      x-repository: DISTRIBUTION_CONTRACT
      x-dynamodb:
        entityType: "DISTRIBUTION_CONTRACT"
        pkPatternTemplate: "DST#${distributorId}"
        skPatternTemplate: "CTR#${contractId}"
        pkPattern: template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./distributors.schemas.yaml#/components/schemas/DistributionContractUpsert
      responses:
        '201':
          description: Contract created
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributionContractResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/distributors/{distributorId}/contracts/{contractId}:
    parameters:
      - name: distributorId
        in: path
        required: true
        schema: { type: string }
      - name: contractId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDistributionContract
      tags: [Distributors]
      summary: Get contract
      security:
        - bearerAuth: []
      x-repository: DISTRIBUTION_CONTRACT
      x-dynamodb:
        entityType: "DISTRIBUTION_CONTRACT"
        pkPatternTemplate: "DST#${distributorId}"
        skPatternTemplate: "CTR#${contractId}"
        pkPattern: template
      responses:
        '200':
          description: Contract
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributionContractResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem
    patch:
      operationId: amendDistributionContract
      tags: [Distributors]
      summary: Amend contract fields
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      x-repository: DISTRIBUTION_CONTRACT
      x-dynamodb:
        entityType: "DISTRIBUTION_CONTRACT"
        pkPatternTemplate: "DST#${distributorId}"
        skPatternTemplate: "CTR#${contractId}"
        pkPattern: template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./distributors.schemas.yaml#/components/schemas/DistributionContractUpsert
      responses:
        '200':
          description: Contract amended
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributionContractResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/distributors/{distributorId}/contracts/{contractId}/activate:
    parameters:
      - name: distributorId
        in: path
        required: true
        schema: { type: string }
      - name: contractId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: activateDistributionContract
      tags: [Distributors]
      summary: Activate contract when ownership fields complete
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      x-repository: none
      responses:
        '200':
          description: Contract activated
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributionContractResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/distributors/{distributorId}/pause:
    parameters:
      - name: distributorId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: pauseDistributor
      tags: [Distributors]
      summary: Pause distributor
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      x-repository: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./distributors.schemas.yaml#/components/schemas/PauseResumeRequest
      responses:
        '200':
          description: Distributor paused
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributorResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/distributors/{distributorId}/resume:
    parameters:
      - name: distributorId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: resumeDistributor
      tags: [Distributors]
      summary: Resume distributor with approval
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      x-repository: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./distributors.schemas.yaml#/components/schemas/PauseResumeRequest
      responses:
        '200':
          description: Distributor resumed
          content:
            application/json:
              schema:
                $ref: ./distributors.schemas.yaml#/components/schemas/DistributorResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        'default':
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
